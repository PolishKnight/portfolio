@if (skill.name !== '__SEPARATOR__') {
  <div
    (click)="openSkill()"
    class="skill-card"
    role="button"
    tabindex="0"
    [style.--skill-color]="skill.color"
  >
    <div class="icon-wrapper" [style.backgroundColor]="skill.color + '22'">
      <img [src]="skill.iconSrc" [alt]="skill.name + ' logo'" />
    </div>
    <h3>{{ skill.name }}</h3>
  </div>
}
