<h2 mat-dialog-title>Napisz do mnie</h2>

<mat-dialog-content>
  <div class="contact-form">
    <mat-form-field appearance="outline">
      <mat-label>Twój email</mat-label>
      <input matInput type="email" [(ngModel)]="email" placeholder="email@example.com" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Wiadomość</mat-label>
      <textarea
        matInput
        rows="5"
        [(ngModel)]="message"
        placeholder="W czym mogę pomóc?"
        required
      ></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="close()">Anuluj</button>
  <button mat-button color="primary" (click)="send()" [disabled]="!isValid()">Wyślij</button>
</mat-dialog-actions>
