<nav>
  <div>
    <a href="#about" class="menu-item logo" (click)="onLinkClick()">
      <i class="fas fa-house"></i>
      <span class="name header-name">{{ cs.author.name }}</span>
    </a>

    <a href="#skills" class="menu-item" (click)="onLinkClick()">
      <i class="fas fa-book"></i>
      <span class="name">{{ s.menu.skills[langService.currentLang] }}</span>
    </a>

    <a href="#experience" class="menu-item" (click)="onLinkClick()">
      <i class="fa-solid fa-graduation-cap"></i>
      <span class="name"> {{ s.menu.experience[langService.currentLang] }}</span>
    </a>

    <a href="#projects" class="menu-item" (click)="onLinkClick()">
      <i class="fas fa-code"></i>
      <span class="name"> {{ s.menu.projects[langService.currentLang] }}</span>
    </a>

    <a href="#contact" class="menu-item" (click)="onLinkClick()">
      <i class="fas fa-paper-plane"></i>
      <span class="name"> {{ s.menu.contact[langService.currentLang] }}</span>
    </a>

    <button (click)="openContact()" class="menu-item badge" data-testid="contact-button">
      <i class="fa-regular fa-envelope"></i>
      <span class="name">{{ s.menu.writeToMe[langService.currentLang] }}</span>
    </button>

    <button (click)="openCv()" class="menu-item badge" data-testid="cv-button">
      <i class="fas fa-file-pdf"></i>
      <span class="name"> {{ s.menu.cv[langService.currentLang] }}</span>
    </button>
  </div>

  <div>
    <button class="menu-item badge" (click)="themeService.toggleTheme()">
      <i class="fa-solid fa-circle-half-stroke"></i>
      <span class="name"> {{ cs.theme[themeService.currentTheme][langService.currentLang] }}</span>
    </button>

    <button (click)="changeLanguage()" class="menu-item badge globus-btn">
      <i class="fas fa-globe"></i>
      <span class="current-lang">{{ langService.currentLang.toUpperCase() }}</span>
    </button>
  </div>
</nav>
